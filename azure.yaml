name: functions-hosted-skill-expense-processor
metadata:
  template: functions-hosted-skill-expense-processor@1.0.0
services:
  api:
    project: ./src
    language: python
    host: function
    hooks:
      # Generate src/requirements.txt from src/pyproject.toml + src/uv.lock right before
      # packaging, so the Functions remote build (Oryx) has one while deps stay defined in
      # pyproject.toml. The file is gitignored — uv is the single source of truth.
      prepackage:
        posix:
          shell: sh
          continueOnError: false
          run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements.txt
        windows:
          shell: pwsh
          continueOnError: false
          run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements.txt
# Authorize Dataverse after provisioning, then seed the policy library.
hooks:
  postprovision:
    posix:
      shell: sh
      continueOnError: false
      interactive: true
      run: ./infra/scripts/postprovision.sh
    windows:
      shell: pwsh
      continueOnError: false
      interactive: true
      run: ./infra/scripts/postprovision.ps1
  postdeploy:
    posix:
      shell: sh
      continueOnError: false
      interactive: false
      run: ./infra/scripts/postdeploy.sh
    windows:
      shell: pwsh
      continueOnError: false
      interactive: false
      run: ./infra/scripts/postdeploy.ps1
